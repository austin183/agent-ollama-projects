services:
  sftp:
    image: docker.io/atmoz/sftp:alpine
    container_name: homelab-sftp
    restart: unless-stopped
    ports:
      - "2223:22/tcp"
    volumes:
      - restic-backup_sftp_data:/home/labratorian
      - ./config/auth.conf:/etc/ssh/sshd_config.d/auth.conf:ro
      - ./config/sshd.pam:/etc/pam.d/sshd:ro
      - ./config/sftp-entrypoint.sh:/tmp/sftp-entrypoint.sh:ro
      - ./ssh-config/id_rsa.pub:/tmp/id_rsa.pub:ro
    environment:
      - TZ=America/New_York
      - SFTP_USERS=${SFTP_USERS}
    entrypoint: ["/bin/sh", "/tmp/sftp-entrypoint.sh"]
    networks:
      - homelab-restic-backup
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 22 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  restic-init:
    image: docker.io/restic/restic:0.18.0
    container_name: homelab-restic-init
    restart: "no"
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./init-setup.sh:/init.sh:ro
      - ./ssh-config/id_rsa:/root/.ssh/id_rsa:ro
    environment:
      - RESTIC_REPOSITORY=sftp://labratorian@sftp:22/backups/repo
      - RESTIC_PASSWORD=${RESTIC_PASSWORD}
      - RESTIC_CACHE_DIR=/cache
    networks:
      - homelab-restic-backup

  restic-backup:
    image: docker.io/restic/restic:0.18.0
    container_name: homelab-restic-backup
    restart: "no"
    volumes:
      - ./source-data:/source:rw
      - ./ssh-config/id_rsa:/root/.ssh/id_rsa:ro
      - ./backup.sh:/backup.sh:ro
    environment:
      - TZ=America/New_York
      - RESTIC_REPOSITORY=sftp://labratorian@sftp:22/backups/repo
      - RESTIC_PASSWORD=${RESTIC_PASSWORD}
      - RESTIC_COMPRESSION=auto
    entrypoint: ["/bin/sh", "/backup.sh"]

  test-client:
    image: docker.io/alpine:3.21
    container_name: homelab-restic-backup-test
    command: >
      /bin/sh -c "
        apk add --no-cache openssh-client sshpass curl restic &&
        printf 'Host *\n    StrictHostKeyChecking no\n    UserKnownHostsFile /dev/null\n' > /etc/ssh/ssh_config &&
        sleep 3600
      "
    volumes:
      - ./source-data:/source:ro
      - ./ssh-config:/root/.ssh:ro
    environment:
      - RESTIC_REPOSITORY=sftp://labratorian@sftp:22/backups/repo
      - RESTIC_PASSWORD=${RESTIC_PASSWORD}
      - SFTP_PASSWORD=${SFTP_PASSWORD}
    networks:
      - homelab-restic-backup

networks:
  homelab-restic-backup:
    driver: bridge

volumes:
  restic-backup_sftp_data:
