services:
  vaultwarden:
    image: docker.io/vaultwarden/server:1.35.7
    container_name: homelab-vaultwarden
    restart: unless-stopped
    ports:
      - "8086:80/tcp"
    volumes:
      - vaultwarden_data:/data
    environment:
      - TZ=America/New_York
      - WEBSOCKET_ENABLED=true
      - SIGNUPS_ALLOWED=false
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - DATABASE_URL=/data/db.sqlite3
    networks:
      - homelab-vaultwarden
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  test-client:
    image: docker.io/alpine:3.21
    container_name: homelab-vaultwarden-test
    command: sleep 3600
    networks:
      - homelab-vaultwarden
    depends_on:
      - vaultwarden

volumes:
  vaultwarden_data:

networks:
  homelab-vaultwarden:
    driver: bridge
