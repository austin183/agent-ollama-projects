# Peer discovery backend
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config

# Cluster member nodes
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq3

# AMQP listener
listeners.tcp.default = 5672

# Management UI
management.tcp.port = 15672

# Disable guest login via network
loopback_users.guest = false

# Default queue type for new queues (quorum is default since 3.9, but be explicit)
default_queue_type = quorum

# Mnesia tuning for container environments
mnesia_table_loading_retry_timeout = 10000
mnesia_table_loading_retry_limit = 2
