# Redis configuration for homelab experiment
# Minimal config demonstrating persistence options

# Bind to all interfaces within the container
bind 0.0.0.0

# Protected mode (disabled for lab use - containers on isolated network)
protected-mode no

# Default port
port 6379

# RDB persistence - snapshot at intervals
save 900 1
save 300 10
save 60 10000

# RDB filename
dbfilename dump.rdb

# Directory for RDB files
dir /data

# AOF persistence - append only file
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Disable default password for lab use
# requirepass your_password_here

# Logging
loglevel notice
logfile ""
