services:
  boinc:
    image: docker.io/boinc/client:intel
    container_name: homelab-boinc
    restart: unless-stopped
    ports:
      - "31416:31416/tcp"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./boinc-data:/var/lib/boinc
    environment:
      - TZ=America/New_York
      - BOINC_GUI_RPC_PASSWORD=${BOINC_GUI_RPC_PASSWORD}
      - BOINC_CMD_LINE_OPTIONS=--allow_remote_gui_rpc
    networks:
      - homelab-boinc
    healthcheck:
      test: ["CMD-SHELL", "boinccmd --passwd ${BOINC_GUI_RPC_PASSWORD} --get_cc_status > /dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  test-client:
    image: docker.io/library/alpine:3.21
    container_name: homelab-boinc-test
    command: sleep 3600
    depends_on:
      - boinc
    networks:
      - homelab-boinc

networks:
  homelab-boinc:
    driver: bridge
