services:
  boinc-cpu:
    image: docker.io/boinc/client@sha256:a9629c767fcaab695401a2a4a6a34befe087f6cc59a41c51539531eff645e6e2
    container_name: homelab-boinc-cpu
    restart: unless-stopped
    ports:
      - "31417:31416/tcp"
    volumes:
      - ./boinc-cpu-data:/var/lib/boinc
    environment:
      - TZ=America/New_York
      - BOINC_GUI_RPC_PASSWORD=${BOINC_GUI_RPC_PASSWORD}
      - BOINC_CMD_LINE_OPTIONS=--allow_remote_gui_rpc
    networks:
      - homelab-boinc-cpu
    healthcheck:
      test: ["CMD-SHELL", "boinccmd --passwd ${BOINC_GUI_RPC_PASSWORD} --get_cc_status > /dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  test-client:
    image: docker.io/library/alpine:3.21
    container_name: homelab-boinc-cpu-test
    command: sleep 3600
    depends_on:
      - boinc-cpu
    networks:
      - homelab-boinc-cpu

networks:
  homelab-boinc-cpu:
    driver: bridge
