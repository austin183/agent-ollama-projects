services:
  loki:
    image: docker.io/grafana/loki:3.3.2
    container_name: homelab-loki
    restart: unless-stopped
    command:
      - '-config.file=/etc/loki/loki-config.yml'
    ports:
      - "3100:3100/tcp"
    volumes:
      - ./conf/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - homelab-observability-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  promtail:
    image: docker.io/grafana/promtail:3.3.2
    container_name: homelab-promtail
    restart: unless-stopped
    volumes:
      - ./conf/promtail-config.yml:/etc/loki/promtail-config.yml:ro
      - /var/log:/var/log:ro
      - promtail_work:/work
      - ./work/logs:/host-logs
    networks:
      - homelab-observability-network
    depends_on:
      - loki

  grafana:
    image: docker.io/grafana/grafana:11.5.3
    container_name: homelab-grafana
    restart: unless-stopped
    ports:
      - "3001:3000/tcp"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./conf/provisioning:/etc/grafana/provisioning:ro
    networks:
      - homelab-observability-network
    depends_on:
      - loki
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  test-client:
    image: docker.io/alpine:3.21
    container_name: homelab-loki-logging-test
    command: sleep 3600
    networks:
      - homelab-observability-network
    depends_on:
      - loki

networks:
  homelab-observability-network:
    driver: bridge

volumes:
  loki_data:
  promtail_work:
  grafana_data:
