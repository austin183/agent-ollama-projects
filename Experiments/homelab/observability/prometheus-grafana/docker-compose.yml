services:
  prometheus:
    image: docker.io/prom/prometheus:v2.52.0
    container_name: homelab-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_grafana_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090/tcp"
    networks:
      - homelab-prometheus-grafana
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  grafana:
    image: docker.io/grafana/grafana:11.1.0
    container_name: homelab-grafana
    restart: unless-stopped
    volumes:
      - prometheus_grafana_grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - TZ=America/New_York
    ports:
      - "3000:3000/tcp"
    networks:
      - homelab-prometheus-grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  node_exporter:
    image: docker.io/prom/node-exporter:v1.8.2
    container_name: homelab-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100/tcp"
    networks:
      - homelab-prometheus-grafana

  test-client:
    image: docker.io/alpine:3.21
    container_name: homelab-prometheus-grafana-test
    command: sleep 3600
    networks:
      - homelab-prometheus-grafana
    depends_on:
      - prometheus
      - grafana

networks:
  homelab-prometheus-grafana:
    driver: bridge

volumes:
  prometheus_grafana_prometheus_data:
  prometheus_grafana_grafana_data:
