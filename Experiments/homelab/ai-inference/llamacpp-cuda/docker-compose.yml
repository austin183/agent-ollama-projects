services:
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: homelab-llamacpp-cuda
    restart: unless-stopped
    ports:
      - "11437:8080/tcp"
    volumes:
      - ./models:/models
    devices:
      - nvidia.com/gpu=all
    command: >
      -m /models/gemma-3-1b-it-Q4_K_M.gguf
      --host 0.0.0.0 --port 8080
      -c 4096
    networks:
      - homelab-llamacpp-cuda
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  test-client:
    image: docker.io/library/alpine:3.21
    container_name: homelab-llamacpp-cuda-test
    command: sleep 3600
    depends_on:
      - llamacpp
    networks:
      - homelab-llamacpp-cuda

networks:
  homelab-llamacpp-cuda:
    driver: bridge
