window.runHowlerTest = async function() {
  const results = {};
  const bytes = Uint8Array.from(atob(window.__MP3_B64__), c => c.charCodeAt(0));
  const blob = new Blob([bytes], {type: 'audio/mpeg'});
  const blobUrl = URL.createObjectURL(blob);

  results.howlerVersion = Howler.version || '2.2.3 (cdn)';
  Howler.volume(); // trigger lazy AudioContext setup
  results.codecs = { mp3: Howler.codecs('mp3'), wav: Howler.codecs('wav'), ogg: Howler.codecs('ogg'), m4a: Howler.codecs('m4a'), webm: Howler.codecs('webm'), flac: Howler.codecs('flac') };
  results.usingWebAudio = Howler.usingWebAudio;
  results.ctxStateInitial = Howler.ctx.state;
  results.baseLatency = Howler.ctx.baseLatency;
  results.outputLatency = Howler.ctx.outputLatency;
  await Howler.ctx.resume();
  results.ctxStateAfterResume = Howler.ctx.state;

  // 1. XHR directly on a blob: URL (Howler's Web Audio load path)
  results.blobXhr = await new Promise(res => {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', blobUrl, true);
    xhr.responseType = 'arraybuffer';
    xhr.onload = () => res({ ok: true, status: xhr.status, byteLength: xhr.response ? xhr.response.byteLength : -1 });
    xhr.onerror = () => res({ ok: false, status: xhr.status });
    xhr.send();
  });

  // 2a. Howl from blob URL WITHOUT format (expect: codec detection failure)
  const noFmt = await new Promise((res) => {
    new Howl({ src: [blobUrl], onload: () => res({ loaded: true }),
               onloaderror: (id, e) => res({ loaded: false, error: String(e) }) });
    setTimeout(() => res({ loaded: false, error: 'timeout' }), 4000);
  });
  results.blobNoFormat = noFmt;

  // 2b. Howl from blob URL WITH format: ['mp3']
  const t0 = performance.now();
  const howl = await new Promise((res, rej) => {
    const h = new Howl({ src: [blobUrl], format: ['mp3'],
      onload: () => res(h),
      onloaderror: (id, e) => rej(new Error('loaderror: ' + e)) });
    setTimeout(() => rej(new Error('load timeout')), 5000);
  });
  results.howlBlob = { loadMs: Math.round(performance.now() - t0), duration: howl.duration(), state: howl.state() };

  // 2c. Howl from base64 data URI (codec inferred from MIME, no format needed)
  const dataUri = 'data:audio/mpeg;base64,' + window.__MP3_B64__;
  const howlData = await new Promise((res, rej) => {
    const h = new Howl({ src: [dataUri],
      onload: () => res(h),
      onloaderror: (id, e) => rej(new Error('datauri loaderror: ' + e)) });
    setTimeout(() => rej(new Error('datauri load timeout')), 5000);
  });
  results.howlDataUri = { duration: howlData.duration(), state: howlData.state() };
  howlData.unload();

  // 3. seek while paused (Web Audio: should store _seek, applied on play)
  howl.seek(1.5);
  results.seekWhilePaused = howl.seek();

  // 4. play, verify playing + live seek position
  howl.play();
  await new Promise(r => setTimeout(r, 400));
  results.playing = howl.playing();
  results.seekWhilePlaying = howl.seek(); // expected ~1.5 + 0.4
  howl.stop();
  await new Promise(r => setTimeout(r, 50));
  results.afterStop = { playing: howl.playing(), seek: howl.seek() };

  // 5. Sample-accurate scheduled start(when, offset) on Howler's context
  const buf = await Howler.ctx.decodeAudioData(bytes.buffer.slice(0));
  results.decoded = { duration: +buf.duration.toFixed(3), sampleRate: buf.sampleRate, channels: buf.numberOfChannels };
  const when = Howler.ctx.currentTime + 1.0;
  const src = Howler.ctx.createBufferSource();
  src.buffer = buf;
  src.connect(Howler.masterGain);
  results.scheduledStart = await new Promise(res => {
    src.onended = () => res({
      endCtxTime: +Howler.ctx.currentTime.toFixed(4),
      expectedEnd: +(when + (buf.duration - 0.5)).toFixed(4),
      endDeltaMs: +(Howler.ctx.currentTime - (when + (buf.duration - 0.5))) * 1000
    });
    src.start(when, 0.5);
  });

  // 6. Private API surface (for the record)
  try {
    const s = howl._sounds[0];
    results.privateApi = {
      soundsLen: howl._sounds.length,
      nodeType: s._node ? s._node.constructor.name : null,
      bufferSourceAfterStop: !!(s._node && s._node.bufferSource),
      masterGain: !!Howler.masterGain
    };
  } catch (e) { results.privateApi = { error: String(e) }; }

  howl.unload();
  URL.revokeObjectURL(blobUrl);
  return results;
};
